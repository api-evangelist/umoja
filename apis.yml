aid: umoja
name: Umoja Biopharma
description: >-
  Umoja Biopharma is a Seattle-based clinical-stage immuno-oncology company developing in vivo CAR
  T cell therapies for cancer. Its VivoVec lentiviral platform generates CAR T cells directly in a
  patient's body, removing the ex vivo manufacturing step of traditional cell therapy, and the
  company operates its own manufacturing facility in Louisville, Colorado. Its pipeline includes
  UB-VV111 (CD19), UB-VV400 (the industry's first known CD22-directed in vivo CAR T candidate,
  FDA IND clearance July 2026), and UB-VV500. Umoja is backed by investors including DCVC (DCVC
  Bio) and SoftBank Vision Fund 2. The company publishes no public developer API, OpenAPI, or
  developer portal; this profile captures the company identity and the security posture of its
  public web surface.
